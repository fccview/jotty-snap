name: Build Extensions

on:
  push:
    branches: ["main", "develop"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup the best engine ever
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Make sure it still works
        run: |
          bun run typecheck
          bun test

      - name: Snap it for both browsers
        run: bun run build

      - name: Zip it up
        run: bun run pack

      - name: Keep the zips around
        uses: actions/upload-artifact@v4
        with:
          name: jotty-snap-${{ github.sha }}
          path: artifacts/
          retention-days: 14
